<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>二号位 · 决策中枢</title>
<style>
  :root{
    /* Ant Design 5 配色体系 */
    --bg:#f5f5f5; --surface:#fff; --line:#f0f0f0; --line-strong:#d9d9d9;
    --ink:rgba(0,0,0,.88); --dim:rgba(0,0,0,.65); --faint:rgba(0,0,0,.45);
    --accent:#1677ff; --accent-hover:#4096ff; --accent-soft:#e6f4ff;
    /* 语义色（antd）：用于桶位竖线/概览色块 */
    --s-attack:#ff4d4f; --s-active:#1677ff; --s-cash:#52c41a; --s-probe:#722ed1; --s-idle:#bfbfbf;
    --warning:#faad14;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC",sans-serif}

  header{max-width:920px;margin:0 auto;padding:22px 24px 0;display:flex;align-items:baseline;gap:12px}
  header h1{font-size:17px;margin:0;font-weight:650;letter-spacing:-.01em}
  header .sub{font-size:12px;color:var(--faint);font-family:var(--mono)}
  header .status{margin-left:auto;font-size:11px;color:var(--dim);display:flex;align-items:center;gap:6px}
  header .dot{width:6px;height:6px;border-radius:50%;background:var(--s-cash)}

  nav{max-width:920px;margin:16px auto 0;padding:0 24px;display:flex;gap:2px;
    border-bottom:1px solid var(--line)}
  nav .tab{padding:8px 15px;font-size:13px;cursor:pointer;color:var(--dim);
    border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;align-items:center;gap:7px}
  nav .tab:hover{color:var(--ink)}
  nav .tab.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
  nav .tgroup{font-size:10px;color:var(--faint);letter-spacing:.1em;font-weight:600;
    align-self:center;margin:0 4px 0 14px}
  nav .tgroup:first-child{margin-left:0}
  nav .count{font-family:var(--mono);font-size:11px;color:var(--faint);
    background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:0 5px;line-height:16px}
  nav .tab.on .count{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
  nav .count.hot{color:#fff;background:var(--accent);border-color:var(--accent)}

  main{max-width:920px;margin:0 auto;padding:18px 24px 32px;
    display:grid;gap:11px;grid-template-columns:repeat(auto-fill,minmax(400px,1fr))}
  .full{grid-column:1/-1}
  .section-label{grid-column:1/-1;font-size:11px;letter-spacing:.06em;text-transform:uppercase;
    color:var(--faint);margin:6px 0 -2px;font-weight:600;display:flex;align-items:center;gap:8px}
  .section-label .n{font-family:var(--mono);color:var(--dim)}
  .section-label .rule{flex:1;height:1px;background:var(--line)}

  /* 桶位概览条 */
  .overview{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:14px;
    background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:11px 16px}
  .ov{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--dim)}
  .ov .swatch{width:9px;height:9px;border-radius:2px}
  .ov .cnt{font-family:var(--mono);font-weight:650;color:var(--ink);font-size:14px}

  /* 门禁提议卡 —— 界面唯一视觉重点 */
  .prop{grid-column:1/-1;background:var(--surface);border:1px solid var(--line-strong);
    border-left:3px solid var(--accent);border-radius:8px;padding:13px 16px}
  .prop .top{display:flex;align-items:baseline;gap:9px;margin-bottom:7px}
  .prop .act-name{font-weight:600;font-size:14px}
  .prop .tag{font-family:var(--mono);font-size:11px;color:var(--accent);
    background:var(--accent-soft);border-radius:4px;padding:1px 6px}
  .prop .id{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--faint)}
  .prop .why{color:var(--ink);font-size:13.5px;margin:0 0 9px}
  .prop .args{color:var(--dim);font-size:12px;font-family:var(--mono);
    background:var(--bg);border:1px solid var(--line);border-radius:5px;
    padding:6px 9px;margin:0 0 11px;word-break:break-all}
  .prop .btns{display:flex;gap:8px}
  .btn{border:1px solid var(--line-strong);border-radius:6px;padding:6px 16px;
    font-size:13px;cursor:pointer;background:var(--surface);color:var(--ink)}
  .btn:hover{border-color:var(--dim)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}

  .empty{grid-column:1/-1;color:var(--dim);font-size:13px;text-align:center;
    padding:44px 20px;background:var(--surface);border:1px dashed var(--line-strong);border-radius:8px}
  .empty .lead{color:var(--ink);font-weight:550;margin-bottom:4px}

  .hist{grid-column:1/-1;margin-top:6px}
  .hist .row{font-size:12px;color:var(--dim);padding:5px 0;border-top:1px solid var(--line);
    display:flex;gap:8px;align-items:baseline}
  .hist .verdict{font-family:var(--mono);font-size:11px;flex:0 0 auto}
  .hist .verdict.ok{color:var(--s-cash)} .hist .verdict.no{color:var(--s-attack)}

  /* 此刻聚焦 —— 页面报头，antd 浅色卡片 + 主色点缀 */
  .focus{grid-column:1/-1;background:var(--accent-soft);border:1px solid #91caff;
    border-radius:8px;padding:16px 20px}
  .focus .lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);
    font-weight:600;display:flex;align-items:baseline;gap:8px}
  .focus .by{margin-left:auto;text-transform:none;letter-spacing:0;font-family:var(--mono);color:var(--faint)}
  .focus .sum{font-size:18px;font-weight:600;line-height:1.5;margin-top:8px;cursor:text;color:var(--ink)}
  .focus .chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .focus .chip{background:var(--surface);border:1px solid #91caff;border-radius:6px;
    padding:4px 12px;font-size:12.5px;cursor:pointer;color:var(--accent)}
  .focus .chip:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
  @keyframes flash{0%,100%{box-shadow:none}30%{box-shadow:0 0 0 2px var(--accent)}}
  .card.flash{animation:flash 1.1s}

  .toolbar{grid-column:1/-1;display:flex;justify-content:flex-end}

  /* 项目卡 */
  .card{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--s-idle);
    border-radius:8px;padding:13px 16px}
  .card.attack{border-left-width:5px;border-left-color:var(--s-attack);grid-column:1/-1;
    box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .card.active{border-left-color:var(--s-active)}
  .card.cash{border-left-color:var(--s-cash)}
  .card.probe{border-left-color:var(--s-probe)}
  .card.frozen{border-left-color:var(--s-idle);background:#fbfbfc}
  .card.archived{opacity:.5}
  .card.archived .name{text-decoration:line-through}
  .card .head{display:flex;align-items:center;gap:9px;margin-bottom:9px}
  .card .name{font-weight:650;font-size:15px;cursor:text}
  .card.attack .name{font-size:17px}
  .kind-badge{font-size:11px;color:var(--dim);background:var(--bg);
    border:1px solid var(--line);border-radius:4px;padding:1px 7px;white-space:nowrap}
  .stage-sel{margin-left:auto;font-size:12px;color:var(--dim);border:1px solid var(--line);
    border-radius:6px;padding:3px 7px;background:var(--surface);cursor:pointer}
  .act{border:1px solid var(--line);background:var(--surface);color:var(--dim);
    font-size:11px;padding:3px 9px;border-radius:6px;cursor:pointer}
  .act:hover{border-color:var(--s-attack);color:var(--s-attack)}

  ul.todos{list-style:none;margin:0;padding:0}
  ul.todos li{display:flex;align-items:flex-start;gap:9px;padding:3px 4px;font-size:14px;border-radius:5px}
  ul.todos li:hover{background:var(--bg)}
  ul.todos li .box{flex:0 0 16px;height:16px;margin-top:3px;border:1.5px solid var(--line-strong);
    border-radius:4px;text-align:center;line-height:14px;font-size:11px;color:#fff;cursor:pointer}
  ul.todos li.done .box{background:var(--s-cash);border-color:var(--s-cash)}
  ul.todos li .txt{flex:1;cursor:pointer}
  ul.todos li.done .txt{color:var(--faint);text-decoration:line-through}
  .done-at{font-family:var(--mono);font-size:11px;color:var(--faint);margin-left:auto;white-space:nowrap}
  ul.todos li .mini{opacity:0;color:var(--faint);cursor:pointer;font-size:12px;padding:0 3px}
  ul.todos li:hover .mini{opacity:1}
  ul.todos li .mini:hover{color:var(--s-attack)}
  .addtodo{color:var(--accent);font-size:12px;cursor:pointer;margin-top:7px;display:inline-block}
  .addtodo:hover{text-decoration:underline}
  .trig{color:var(--dim);font-size:12px;margin-top:9px;cursor:pointer;
    border-top:1px dashed var(--line);padding-top:8px}
  .trig b{color:var(--ink);font-weight:600}
  .empty-todo{color:var(--faint);font-size:13px}

  .addbox{grid-column:1/-1;display:flex;gap:8px}
  .addbox input{flex:1;border:1px solid var(--line-strong);border-radius:7px;
    padding:9px 13px;font-size:14px;color:var(--ink)}
  .addbox input:focus{outline:none;border-color:var(--accent)}
  .addbox button{border:none;background:var(--accent);color:#fff;border-radius:7px;
    padding:9px 18px;cursor:pointer;font-size:13px}
  .bl-item{grid-column:1/-1;background:var(--surface);border:1px solid var(--line);
    border-radius:7px;padding:9px 14px;font-size:14px;display:flex;gap:10px;align-items:baseline}
  .bl-item .s{color:var(--faint);font-size:11px;font-family:var(--mono);margin-left:auto}

  /* 预设问题 */
  .kind-badge.hot{color:#fff;background:var(--accent);border-color:var(--accent)}
  .q-prompt{color:var(--dim);font-size:13px;cursor:pointer;margin:2px 0 7px}
  .q-meta{color:var(--faint);font-size:12px;font-family:var(--mono)}
  .q-answers{margin-top:10px;border-top:1px dashed var(--line);padding-top:9px;
    display:grid;gap:9px}
  .ans{background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:9px 12px}
  .ans.sup{opacity:.62}
  .ans-head{display:flex;align-items:baseline;gap:7px;margin-bottom:5px}
  .ans-badge{font-family:var(--mono);font-size:11px;color:var(--accent);
    background:var(--accent-soft);border-radius:4px;padding:0 6px;line-height:17px}
  .ans-badge.c-high{color:var(--s-cash);background:transparent;border:1px solid var(--s-cash)}
  .ans-badge.c-medium{color:var(--warning);background:transparent;border:1px solid var(--warning)}
  .ans-badge.c-low{color:var(--s-attack);background:transparent;border:1px solid var(--s-attack)}
  .ans-meta{font-family:var(--mono);font-size:11px;color:var(--faint)}
  .ans-body{white-space:pre-wrap;font-size:13.5px;color:var(--ink);word-break:break-word}
  .ans-body.sup{color:var(--dim)}
  .srcs{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
  .src{font-size:11.5px;color:var(--accent);background:var(--surface);
    border:1px solid var(--line);border-radius:4px;padding:1px 7px;text-decoration:none;
    max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .src:hover{border-color:var(--accent)}
  .ans-ops{margin-top:7px;display:flex;gap:8px}
  .sup-details summary{cursor:pointer;font-size:11.5px;color:var(--faint);font-family:var(--mono)}
  .sup-details{margin-top:5px}

  footer{grid-column:1/-1;color:var(--faint);font-size:11px;text-align:center;
    padding-top:10px;font-family:var(--mono)}
</style>
</head>
<body>
<header>
  <h1>参谋部</h1>
  <span class="sub">一号位的参谋部 · deputy</span>
  <span class="status"><span class="dot"></span>运行中 · 分身提议，你做门禁</span>
</header>
<nav id="tabs"></nav>
<main id="board"></main>

<script>
const ORDER = {attack:0, operate:1, probe:2, maintain:3, frozen:4, archived:5};
const ACTIVE = new Set(["operate","probe"]);
const CASH = new Set(["maintain"]);
// 纯文字状态名，无 emoji
const STAGES = {spark:"火花",probe:"验证",attack:"主攻",operate:"运营",
                maintain:"维护",frozen:"雪藏",archived:"归档"};
// 导航按三处分组：作战（项目管理）/ 军情（预设问题）/ 讲武（学习）
const TAB_GROUPS = [
  ["作战", [["board","全盘"],["gate","门禁"],["backlog","需求池"]]],
  ["军情", [["questions","军情"]]],
  ["讲武", [["learning","讲武"]]],
];
window._tab = window._tab || "board";
window._state = null; window._props = [];
window._questions = []; window._openQ = null; window._answers = null;
window._learning = []; window._openL = null; window._learningDetail = null;
window._intel = {loaded:false, degraded:false, loading:false, rows:[], total:0,
                 page:1, filters:{domain_id:"", kind:"", min_stars:false, sort:"time"},
                 domains:[]};

async function load(){
  try{
    const [s, props, qs, ls] = await Promise.all([
      fetch("/api/state").then(r=>{if(!r.ok)throw new Error("HTTP "+r.status);return r.json()}),
      fetch("/api/proposals?status=").then(r=>r.ok?r.json():[]),
      fetch("/api/questions").then(r=>r.ok?r.json():[]),
      fetch("/api/learning").then(r=>r.ok?r.json():[])
    ]);
    window._state = s; window._props = props; window._questions = qs; window._learning = ls;
    // 展开中的问题：每次轮询顺带刷新其回答（保持版本/未读最新）
    window._answers = window._openQ
      ? await fetch(`/api/question/${window._openQ}/answers`).then(r=>r.ok?r.json():[])
      : null;
    // 展开中的主题：顺带刷新详情（知识点自评状态/小结）
    window._learningDetail = window._openL
      ? await fetch(`/api/learning/${window._openL}`).then(r=>r.ok?r.json():null)
      : null;
    render();
  }catch(e){
    document.getElementById("board").innerHTML =
      `<div class="empty"><div class="lead">连不上决策中枢</div>
         请确认服务在运行：<code>uv run uvicorn app.api:app --port 8899</code>
         <div style="margin-top:6px;font-family:var(--mono);font-size:12px">${esc(String(e.message||e))}</div></div>`;
  }
}
async function post(url, body){
  const r = await fetch(url, {method:"POST", headers:{"Content-Type":"application/json"},
    body: body?JSON.stringify(body):null});
  if(!r.ok){ const e = await r.json().catch(()=>({})); alert(e.detail||"操作失败"); }
  await load();
}
function setTab(t){
  window._tab = t; render();
  if(t==="questions" && !window._intel.loaded) loadIntel();  // 情报流不进轮询，开 tab 才拉
}

// 门禁
function approve(id){ post(`/api/proposals/${id}/approve`); }
function reject(id){ const n=prompt("驳回理由（可空）：",""); if(n!==null) post(`/api/proposals/${id}/reject`,{note:n}); }
// todo / 项目 / 聚焦 / 需求池
function toggle(pid,tid,cur){ post("/api/todo/toggle",{project_id:pid,todo_id:tid,done:!cur}); }
function addTodo(pid){ const t=prompt("新增 todo："); if(t&&t.trim()) post("/api/todo/add",{project_id:pid,text:t}); }
function editTodo(pid,tid,old){ const t=prompt("修改 todo：",old); if(t&&t.trim()) post("/api/todo/edit",{project_id:pid,todo_id:tid,text:t}); }
function removeTodo(pid,tid){ if(confirm("删除这条 todo？")) post("/api/todo/remove",{project_id:pid,todo_id:tid}); }
function addProject(){ const n=prompt("新项目名称（默认从火花起步）："); if(n&&n.trim()) post("/api/project/add",{name:n}); }
function jump(id){ setTab("board"); setTimeout(()=>{const el=document.getElementById("card-"+id);
  if(el){ el.scrollIntoView({behavior:"smooth",block:"center"});
    el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash"); }},50); }
function editFocus(old){ const t=prompt('改写「此刻聚焦」结论：',old);
  if(t&&t.trim()) post("/api/focus",{summary:t,items:(window._lastFocus||[])}); }
function renameProject(pid,old){ const n=prompt("项目改名：",old); if(n&&n.trim()) post("/api/project/rename",{project_id:pid,name:n}); }
function changeStage(pid,st){ post("/api/project/stage",{project_id:pid,stage:st}); }
function reorder(pid,targetId,position,ev){ ev.stopPropagation(); post("/api/project/reorder",{project_id:pid,target_id:targetId,position}); }
function editTrigger(pid,old){ const t=prompt("解冻扳机（满足什么条件才启动）：",old||""); if(t!==null) post("/api/project/trigger",{project_id:pid,trigger:t}); }
function archive(pid,ev){ ev.stopPropagation(); if(confirm("归档这个项目？（可恢复）")) post(`/api/project/${pid}/archive`); }
function addBacklog(){ const el=document.getElementById("bl-in"); const t=el.value;
  if(t&&t.trim()) post("/api/backlog/add",{text:t}); }
// 预设问题
function addQuestion(){
  const t=prompt("问题标题（看板上显示的名字）："); if(!t||!t.trim())return;
  const p=prompt("问题内容（给 AI 的完整问题，可含关注角度）："); if(!p||!p.trim())return;
  const c=prompt("节奏 daily / weekly / manual：","daily");
  post("/api/question/add",{title:t.trim(),prompt:p.trim(),cadence:(c||"daily").trim()});
}
function editQuestion(qid){
  const q=(window._questions||[]).find(x=>x.id===qid); if(!q)return;
  const t=prompt("标题：",q.title); if(t===null)return;
  const p=prompt("问题内容：",q.prompt); if(p===null)return;
  const c=prompt("节奏 daily/weekly/manual：",q.cadence); if(c===null)return;
  post(`/api/question/${qid}/edit`,{title:t.trim(),prompt:p.trim(),cadence:c.trim()||q.cadence});
}
function runQuestion(qid){ post(`/api/question/${qid}/run`); }
function toggleActive(qid,cur){ post(`/api/question/${qid}/active`,{active:!cur}); }
function removeQuestion(qid){ if(confirm("删除这个问题及其全部回答？")) post(`/api/question/${qid}/remove`); }
function readAnswer(aid){ post(`/api/answer/${aid}/read`); }
function delAnswer(aid){ if(confirm("删除这条回答？")) post(`/api/answer/${aid}/delete`); }
function openQuestion(qid){
  window._openQ = window._openQ===qid ? null : qid;
  window._answers = null;
  render();
  if(window._openQ) load();  // 按需拉取该题回答
}
// 讲武堂
function addTrack(){
  const t=prompt("学习主题（如：具身智能）："); if(!t||!t.trim())return;
  const g=prompt("一句话学习目标（如：能看懂前沿论文）："); if(!g||!g.trim())return;
  post("/api/learning/track/add",{title:t.trim(),goal:g.trim()});
}
function editTrack(tid){
  const t=(window._learning||[]).find(x=>x.id===tid); if(!t)return;
  const ti=prompt("主题名：",t.title); if(ti===null)return;
  const g=prompt("学习目标：",t.goal); if(g===null)return;
  post(`/api/learning/track/${tid}/edit`,{title:ti.trim(),goal:g.trim()});
}
function setTrackStatus(tid,st){ post(`/api/learning/track/${tid}/status`,{status:st}); }
function removeTrack(tid){ if(confirm("删除该主题及其大纲与全部课程小结？")) post(`/api/learning/track/${tid}/remove`); }
function setPoint(pid,st){ post(`/api/learning/point/${pid}/status`,{status:st}); }
function openLearning(tid){
  window._openL = window._openL===tid ? null : tid;
  window._learningDetail = null;
  render();
  if(window._openL) load();  // 按需拉取主题详情（知识点/小结）
}

function render(){
  const s = window._state; if(!s) return;
  const props = window._props || [];
  const pend = props.filter(p=>p.status==="pending");
  const unread = (window._questions||[]).reduce((n,q)=>n+(q.unread_count||0),0);

  document.getElementById("tabs").innerHTML = TAB_GROUPS.map(([group, tabs])=>
    `<span class="tgroup">${group}</span>` + tabs.map(([k,label])=>{
      let count = "";
      if(k==="gate" && pend.length) count = `<span class="count hot">${pend.length}</span>`;
      else if(k==="questions" && unread) count = `<span class="count hot">${unread}</span>`;
      return `<div class="tab ${k===window._tab?'on':''}" onclick="setTab('${k}')">${label}${count}</div>`;
    }).join("")
  ).join("");

  let h = "";
  if(window._tab==="gate") h = renderGate(pend, props);
  else if(window._tab==="board") h = renderBoard(s);
  else if(window._tab==="questions") h = renderQuestions() + renderIntel();
  else if(window._tab==="learning") h = renderLearning();
  else h = renderBacklog(s);
  h += `<footer>更新于 ${new Date().toLocaleTimeString()} · 唯一真源 SQLite · 网页与分身同一份数据</footer>`;
  document.getElementById("board").innerHTML = h;
}

function renderGate(pend, props){
  let h = "";
  if(!pend.length){
    h += `<div class="empty"><div class="lead">门禁队列为空</div>
      分身没有待你拍板的提议。它经 propose 提交的写操作会出现在这里，等你批准或驳回。</div>`;
  }else{
    h += `<p class="section-label">待你拍板 · ${pend.length} 条</p>`;
    for(const p of pend){
      const argstr = Object.entries(p.args||{}).map(([k,v])=>`${k}=${JSON.stringify(v)}`).join("　");
      h += `<div class="prop">
        <div class="top"><span class="tag">${esc(p.action)}</span>
          <span class="act-name">${esc(actionLabel(p.action))}</span>
          <span class="id">${esc(p.by)} · #${p.id}</span></div>
        <p class="why">${esc(p.reason||"（未附理由）")}</p>
        <div class="args">${esc(argstr)}</div>
        <div class="btns">
          <button class="btn primary" onclick="approve(${p.id})">批准</button>
          <button class="btn" onclick="reject(${p.id})">驳回</button>
        </div></div>`;
    }
  }
  const done = props.filter(p=>p.status!=="pending").slice(0,8);
  if(done.length){
    h += `<p class="section-label" style="margin-top:14px">最近处理</p><div class="hist">` + done.map(p=>{
      const v = p.status==="approved"?`<span class="verdict ok">批准</span>`:`<span class="verdict no">驳回</span>`;
      return `<div class="row">${v}<span>${esc(actionLabel(p.action))}${p.note?` — ${esc(p.note)}`:""}</span></div>`;
    }).join("") + `</div>`;
  }
  return h;
}

// 桶定义：由 stage 映射（不新增数据字段）。顺序即呈现顺序。
const BUCKETS = [
  {key:"attack",   label:"主攻",     cls:"attack", color:"var(--s-attack)", stages:["attack"]},
  {key:"operate",  label:"运营",     cls:"active", color:"var(--s-active)", stages:["operate"]},
  {key:"maintain", label:"维护 · 收租", cls:"cash", color:"var(--s-cash)",  stages:["maintain"]},
  {key:"probe",    label:"探索",     cls:"probe",  color:"var(--s-probe)",  stages:["probe","spark"]},
  {key:"frozen",   label:"雪藏",     cls:"frozen", color:"var(--s-idle)",   stages:["frozen"]},
  {key:"archived", label:"归档",     cls:"archived",color:"var(--s-idle)",  stages:["archived"]},
];

function projectCard(p, prevId, nextId){
  const isArch = p.stage==="archived";
  const b = BUCKETS.find(b=>b.stages.includes(p.stage)) || BUCKETS[3];
  const todos = (p.todos||[]).map(t=>{
    const doneAt = t.done_at ? `<span class="done-at">${t.done_at.slice(5,10)}</span>` : "";
    return `<li class="${t.done?"done":""}">
      <span class="box" onclick="toggle('${p.id}','${t.id}',${t.done})">${t.done?"✓":""}</span>
      <span class="txt" onclick="toggle('${p.id}','${t.id}',${t.done})">${esc(t.text)}</span>${doneAt}
      <span class="mini" title="修改" onclick="editTodo('${p.id}','${t.id}',${jq(t.text)})">✎</span>
      <span class="mini" title="删除" onclick="removeTodo('${p.id}','${t.id}')">×</span>
    </li>`}).join("");
  const opts = Object.keys(STAGES).map(k=>`<option value="${k}" ${k===p.stage?"selected":""}>${STAGES[k]}</option>`).join("");
  const up = prevId ? `<span class="act" title="上移" onclick="reorder('${p.id}','${prevId}','before',event)">↑</span>` : "";
  const down = nextId ? `<span class="act" title="下移" onclick="reorder('${p.id}','${nextId}','after',event)">↓</span>` : "";
  return `<div class="card ${b.cls}" id="card-${p.id}">
    <div class="head">
      <span class="name" onclick="renameProject('${p.id}',${jq(p.name)})">${esc(p.name)}</span>
      <span class="kind-badge">${p.kind==="tool"?"工具":"商业"}</span>
      <select class="stage-sel" onchange="changeStage('${p.id}',this.value)">${opts}</select>
      ${up}${down}
      ${isArch?"":`<span class="act" onclick="archive('${p.id}',event)">归档</span>`}
    </div>
    ${todos?`<ul class="todos">${todos}</ul>`:`<div class="empty-todo">暂无 todo</div>`}
    <span class="addtodo" onclick="addTodo('${p.id}')">＋ 加一条</span>
    ${p.stage==="frozen"?`<div class="trig" onclick="editTrigger('${p.id}',${jq(p.trigger||'')})">解冻扳机：<b>${esc(p.trigger||"（点击设置）")}</b></div>`:""}
  </div>`;
}

function renderBoard(s){
  const nameOf = id => (s.projects.find(x=>x.id===id)||{}).name || id;
  const f = s.focus || {summary:"", items:[]};
  window._lastFocus = f.items || [];
  const chips = (f.items||[]).map(id=>`<span class="chip" onclick="jump('${id}')">${esc(nameOf(id))}</span>`).join("");

  // 焦点报头
  let h = `<div class="focus">
    <div class="lbl">此刻聚焦<span class="by">${esc(f.by||"自动")}判断 · 点事项直达</span></div>
    <div class="sum" onclick="editFocus(${jq(f.summary||'')})">${esc(f.summary||"（点击设置）")}</div>
    ${chips?`<div class="chips">${chips}</div>`:""}</div>`;

  // 按桶分组
  const byBucket = BUCKETS.map(b=>({b, items: s.projects.filter(p=>b.stages.includes(p.stage))}));

  // 桶位概览条（只列非空桶）
  const ov = byBucket.filter(x=>x.items.length).map(x=>
    `<span class="ov"><span class="swatch" style="background:${x.b.color}"></span>${x.b.label}<span class="cnt">${x.items.length}</span></span>`
  ).join("");
  h += `<div class="overview">${ov||'<span class="ov">暂无项目</span>'}
    <span style="margin-left:auto"><button class="act" onclick="addProject()">＋ 新建项目</button></span></div>`;

  // 各桶分区
  for(const {b, items} of byBucket){
    if(!items.length) continue;
    h += `<p class="section-label">${b.label}<span class="n">${items.length}</span><span class="rule"></span></p>`;
    for(let i=0;i<items.length;i++){
      h += projectCard(items[i], items[i-1]?.id, items[i+1]?.id);
    }
  }
  return h;
}

// ---------- 军情处·翻阅（情报流） ----------

const INTEL_KINDS = {article:"文章", paper:"论文", repo:"仓库"};

async function loadIntel(){
  const I = window._intel;
  I.loading = true; render();
  const f = I.filters, p = new URLSearchParams();
  if(f.domain_id) p.set("domain_id", f.domain_id);
  if(f.kind) p.set("kind", f.kind);
  if(f.min_stars) p.set("min_stars", "4");
  if(f.sort && f.sort!=="time") p.set("sort", f.sort);
  p.set("page", I.page);
  try{
    const [docs, domains] = await Promise.all([
      fetch(`/api/intel/docs?${p}`).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}),
      I.domains.length ? Promise.resolve(null)
        : fetch("/api/intel/domains").then(r=>{if(!r.ok)throw new Error(r.status);return r.json()})
    ]);
    I.rows = docs.docs; I.total = docs.total; I.degraded = false;
    if(domains) I.domains = domains;
  }catch(e){ I.degraded = true; }
  I.loading = false; I.loaded = true;
  render();
}
function intelFilter(k, v){ window._intel.filters[k] = v; window._intel.page = 1; loadIntel(); }
function intelToggleMinStars(cb){ window._intel.filters.min_stars = cb.checked; window._intel.page = 1; loadIntel(); }
function intelPage(d){
  const np = window._intel.page + d;
  if(np < 1 || np > Math.max(1, Math.ceil(window._intel.total/30))) return;
  window._intel.page = np; loadIntel();
}
async function intelMark(id, field){
  const row = (window._intel.rows||[]).find(r=>r.id===id); if(!row) return;
  const body = {}; body[field] = !row[field];
  const r = await fetch(`/api/intel/reading/${id}`, {method:"POST",
    headers:{"Content-Type":"application/json"}, body: JSON.stringify(body)});
  if(!r.ok){ const e = await r.json().catch(()=>({})); alert(e.detail||"写回失败"); return; }
  row[field] = !row[field];  // feed-curator 只回 ok，乐观翻转（下次拉流为准）
  render();
}

function renderIntel(){
  const I = window._intel;
  let h = `<p class="section-label">情报流<span class="n">${I.total}</span><span class="rule"></span></p>`;
  if(I.degraded){
    h += `<div class="empty"><div class="lead">图书馆闭馆</div>
      feed-curator 没连上，情报流暂时拉不到。奏折不受影响。
      <div style="margin-top:9px"><button class="act" onclick="loadIntel()">重试</button></div></div>`;
    return h;
  }
  const f = I.filters;
  const domOpts = ['<option value="">全部领域</option>'].concat((I.domains||[]).map(d=>
    `<option value="${d.id}" ${String(f.domain_id)===String(d.id)?"selected":""}>${esc(d.name)}</option>`)).join("");
  const kindOpts = ['<option value="">全部类型</option>'].concat(Object.entries(INTEL_KINDS).map(([k,v])=>
    `<option value="${k}" ${f.kind===k?"selected":""}>${v}</option>`)).join("");
  h += `<div class="overview" style="gap:9px">
    <select class="stage-sel" onchange="intelFilter('domain_id', this.value)">${domOpts}</select>
    <select class="stage-sel" onchange="intelFilter('kind', this.value)">${kindOpts}</select>
    <label style="font-size:12.5px;color:var(--dim);cursor:pointer;display:flex;align-items:center;gap:5px">
      <input type="checkbox" ${f.min_stars?"checked":""} onchange="intelToggleMinStars(this)">仅四星</label>
    <select class="stage-sel" onchange="intelFilter('sort', this.value)">
      <option value="time" ${f.sort==="time"?"selected":""}>按时间</option>
      <option value="stars" ${f.sort==="stars"?"selected":""}>按星级</option></select>
    <span class="ov" style="margin-left:auto">${I.loading?"拉取中…":I.total + " 条"}</span></div>`;
  if(I.loading) return h;
  const rows = I.rows||[];
  if(!rows.length) return h + `<div class="empty"><div class="lead">没有匹配的情报</div>换个筛选条件试试。</div>`;
  h += rows.map(d=>{
    const st = d.stars ? `<span class="kind-badge hot">${d.stars} 星</span>` : `<span class="kind-badge">未判定</span>`;
    const doms = (d.domains||[]).map(x=>`<span class="kind-badge">${esc(x)}</span>`).join("");
    const kindB = `<span class="kind-badge">${INTEL_KINDS[d.kind]||esc(d.kind)}</span>`;
    const mark = (field,label)=>`<span class="act" onclick="intelMark(${d.id},'${field}')">${d[field]?"✓ ":""}${label}</span>`;
    return `<div class="card">
      <div class="head">
        <a class="name" href="${escAttr(safeUrl(d.url))}" target="_blank" rel="noopener"
           style="text-decoration:none;color:var(--ink);font-weight:600">${esc(d.title)}</a>
        ${kindB}${st}${doms}
        <span style="margin-left:auto"></span>
        ${mark("is_read","已读")}${mark("is_favorite","收藏")}
      </div>
      ${d.summary?`<div class="q-prompt" style="cursor:default">${esc(d.summary)}</div>`:""}
      <div class="q-meta">${d.sort_time?esc(fmtEpoch(d.sort_time)):""}</div>
    </div>`;
  }).join("");
  const pages = Math.max(1, Math.ceil(I.total/30));
  h += `<div class="toolbar" style="justify-content:space-between;align-items:center">
    <button class="act" onclick="intelPage(-1)" ${I.page<=1?"disabled":""}>上一页</button>
    <span style="font-size:12px;color:var(--faint);font-family:var(--mono)">${I.page} / ${pages}</span>
    <button class="act" onclick="intelPage(1)" ${I.page>=pages?"disabled":""}>下一页</button></div>`;
  return h;
}
function fmtEpoch(sec){
  const n = Number(sec)*1000;
  return isNaN(n) ? String(sec) : new Date(n).toLocaleDateString();
}

function esc(s){return String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}
// 属性上下文转义（esc 不转义引号；href/style 等属性值必须用它）
function escAttr(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
// 来源链接是模型生成内容，仅放行 http(s) 协议，防 javascript: 注入
function safeUrl(u){ const s=String(u||"").trim(); return /^https?:\/\//i.test(s)?s:""; }
// 供双引号 onclick 内安全传字符串参数：先做成单引号 JS 字符串字面量，再 HTML 转义
function jq(s){
  const lit = "'" + String(s).replace(/\\/g,"\\\\").replace(/'/g,"\\'").replace(/\n/g,"\\n") + "'";
  return lit.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
}
