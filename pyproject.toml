[project]
name = "deputy"
version = "0.1.0"
description = "二号位 —— 一人公司的 AI 决策中枢（备料→门禁→释放）"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "mcp[cli]>=1.28.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
